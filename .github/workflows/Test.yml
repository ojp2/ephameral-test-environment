name: Generate Cluster & Workload Inventory Artifact

on:
  workflow_dispatch:
    inputs:
      test_case_name:
        description: 'Optional tag / name for this load test inventory run'
        required: false
        default: 'load-test-baseline'

env:
  ARGO_APP_NAME: "us-upam-stage"
  ARGOCD_SERVER: "argocd-np-server.argocd.svc.cluster.local:80"
  ARGOCD_OPTS: "--server argocd-np-server.argocd.svc.cluster.local:80 --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} --plaintext --grpc-web"

jobs:
  capture-inventory:
    name: Extract EKS & Application State Profile
    runs-on: arc-runners-sgisdevops
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ArgoCD CLI
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL -o $HOME/.local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x $HOME/.local/bin/argocd
          export PATH=$HOME/.local/bin:$PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          argocd version --client

      - name: Generate Structural JSON Inventory and Check Drift
        run: |
          OUTPUT_DIR="./inventory-artifacts"
          mkdir -p "$OUTPUT_DIR"
          
          echo "=== 1. Pulling ArgoCD Config Metadata ==="
          argocd app get "${{ env.ARGO_APP_NAME }}" -o json ${{ env.ARGOCD_OPTS }} > "${OUTPUT_DIR}/raw_argo_manifest.json"
          
          echo "=== 2. Proxying Remote Cluster for Live Runtime Manifests ==="
          # FIXED: Replaced invalid '--live' flag with native '--source live' flag to pull multi-object JSON
          argocd app manifests "${{ env.ARGO_APP_NAME }}" --source live -o json ${{ env.ARGOCD_OPTS }} > "${OUTPUT_DIR}/live_kubernetes_state.json"
          
          echo "=== 3. Processing Granular Cluster Inventory ==="
          # Ingests the raw, un-slurped object stream from the live proxy into a clean JSON array
          jq -s --slurpfile target_meta "${OUTPUT_DIR}/raw_argo_manifest.json" '
            $target_meta[0] as $meta | {
            inventory_run: "${{ github.run_id }}",
            test_case: "${{ github.event.inputs.test_case_name }}",
            captured_at: (now | strflocaltime("%Y-%m-%dT%H:%M:%SZ")),
            target_cluster_endpoint: $meta.spec.destination.server,
            target_namespace: $meta.spec.destination.namespace,
            health_profiles: {
              sync_status: $meta.status.sync.status,
              health_status: $meta.status.health.status
            },
            
            # EXTRACTS REPLICAS DIRECTLY FROM LIVE PROXY MANIFESTS
            workload_replicas: [
              .[]
              | select(.kind == "Deployment" or .kind == "StatefulSet") 
              | {
                  kind: .kind,
                  name: .metadata.name,
                  desired_replicas: (.spec.replicas // 0),
                  ready_replicas: (.status.readyReplicas // 0),
                  available_replicas: (.status.availableReplicas // 0)
                }
            ],
            
            # EXTRACTS LIVE RUNNING PODS & ASSIGNED PARENT HOST NODES
            running_pods: [
              .[]
              | select(.kind == "Pod") 
              | {
                  pod_name: .metadata.name,
                  phase: .status.phase,
                  node_assigned: .spec.nodeName,
                  containers: [try .spec.containers[].name catch []]
                }
            ],
            
            # FILTERS FOR CURRENT SCALING STATUSES (HPA & KEDA)
            scaling_components: [
              $meta.status.resources[] 
              | select(.kind == "HorizontalPodAutoscaler" or .kind == "ScaledObject" or .kind == "ScaledJob") 
              | {
                  kind: .kind,
                  name: .name,
                  status: .status,
                  health: .health.status
                }
            ],
            
            # CAPTURES REGISTERED CORE COMPUTE CLUSTER WORKER NODES
            node_infrastructure: [
              .[]
              | select(.kind == "Node") 
              | {
                  node_name: .metadata.name,
                  instance_type: (.metadata.labels["beta.kubernetes.io/instance-type"] // .metadata.labels["node.kubernetes.io/instance-type"] // "unknown"),
                  aws_zone: (.metadata.labels["topology.kubernetes.io/zone"] // "unknown"),
                  capacity: {
                    cpu: .status.capacity.cpu,
                    memory: .status.capacity.memory,
                    pods_max: .status.capacity.pods
                  },
                  allocatable: {
                    cpu: .status.allocatable.cpu,
                    memory: .status.allocatable.memory
                  }
                }
            ]
          }' "${OUTPUT_DIR}/live_kubernetes_state.json" > "${OUTPUT_DIR}/cluster_inventory.json"
          
          echo "=== 4. Identifying Source Drift (Git vs Live Cluster) ==="
          argocd app diff "${{ env.ARGO_APP_NAME }}" ${{ env.ARGOCD_OPTS }} > "${OUTPUT_DIR}/configuration_drift.patch" || true

      - name: Display Cluster Inventory Logs
        run: |
          echo "========================================================="
          echo "           LOAD TEST CLUSTER INVENTORY SNAPSHOT          "
          echo "========================================================="
          cat ./inventory-artifacts/cluster_inventory.json
          echo "========================================================="

      - name: Archive Load Test Inventory Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-inventory-${{ env.ARGO_APP_NAME }}-${{ github.run_id }}
          path: ./inventory-artifacts/
